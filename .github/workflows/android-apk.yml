name: Build MegaBazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: unzip -o MegaBazar_Android_proyecto_compilable.zip -d proyecto_android

      - name: Conectar App Android a la Web real con Firebase
        run: |
          for m in $(find proyecto_android -name "AndroidManifest.xml"); do
            if ! grep -q "android.permission.INTERNET" "$m"; then
              sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$m"
            fi
          done
          for act in $(find proyecto_android -name "MainActivity.java" -o -name "MainActivity.kt"); do
            PKG=$(grep -E "^package " "$act" | head -n 1 | sed 's/;//g')
            if [[ "$act" == *.java ]]; then
              cat << EOF > "$act"
          $PKG;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://github.io");
                  setContentView(w);
              }
          }
          EOF
            else
              cat << EOF > "$act"
          $PKG
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val w = WebView(this)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.webViewClient = WebViewClient()
                  w.loadUrl("https://github.io")
                  setContentView(w)
              }
          }
          EOF
            fi
            echo "MainActivity conectada en: $act"
          done

      - name: Aplicar icono de MegaBazar junto al Manifest
        run: |
          if [ -f "image_1ffc2675.jpg" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick xmlstarlet
            convert image_1ffc2675.jpg -resize 512x512 megabazar_icon.png
            for m in $(find proyecto_android -name "AndroidManifest.xml"); do
              BASE_DIR=$(dirname "$m")
              mkdir -p "$BASE_DIR/res/drawable"
              cp megabazar_icon.png "$BASE_DIR/res/drawable/megabazar_icon.png"
              xmlstarlet ed -L -d "/manifest/application/@android:icon" -d "/manifest/application/@android:roundIcon" "$m"
              xmlstarlet ed -L -i "/manifest/application" -t attr -n "android:icon" -v "@drawable/megabazar_icon" "$m"
            done
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: |
          DIR=$(find proyecto_android -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find proyecto_android -name "build.gradle" -exec dirname {} \; | head -n 1)
            cd "$DIR"
            gradle assembleDebug
          else
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaBazar-APK
          path: "**/app-debug.apk"
