name: Build MegaBazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: unzip -o MegaBazar_Android_proyecto_compilable.zip -d proyecto_android

      - name: Aplicar icono de MegaBazar en todas las rutas
        run: |
          if [ -f "image_1ffc2675.jpg" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick xmlstarlet
            convert image_1ffc2675.jpg -resize 512x512 megabazar_icon.png
            for r in $(find proyecto_android -type d -name "res"); do
              mkdir -p "$r/drawable"
              cp megabazar_icon.png "$r/drawable/megabazar_icon.png"
              echo "Icono copiado en: $r/drawable/megabazar_icon.png"
            done
            for m in $(find proyecto_android -name "AndroidManifest.xml"); do
              xmlstarlet ed -L -d "/manifest/application/@android:icon" -d "/manifest/application/@android:roundIcon" "$m"
              xmlstarlet ed -L -i "/manifest/application" -t attr -n "android:icon" -v "@drawable/megabazar_icon" "$m"
              echo "Manifest actualizado: $m"
            done
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: |
          DIR=$(find proyecto_android -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find proyecto_android -name "build.gradle" -exec dirname {} \; | head -n 1)
            cd "$DIR"
            gradle assembleDebug
          else
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaBazar-APK
          path: "**/app-debug.apk"
