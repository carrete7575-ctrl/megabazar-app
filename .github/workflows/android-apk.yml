name: Build MegaBazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: unzip -o MegaBazar_Android_proyecto_compilable.zip -d proyecto_android

      - name: Aplicar icono de MegaBazar
        run: |
          if [ -f "image_1ffc2675.jpg" ]; then
            RES_DIR=$(find proyecto_android -type d -name "res" | head -n 1)
            if [ -n "$RES_DIR" ]; then
              rm -rf "$RES_DIR"/mipmap-anydpi*
              for dir in "$RES_DIR"/mipmap-*; do
                if [ -d "$dir" ]; then
                  cp image_1ffc2675.jpg "$dir/ic_launcher.png"
                  cp image_1ffc2675.jpg "$dir/ic_launcher_round.png"
                fi
              done
              echo "Icono aplicado correctamente"
            fi
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: |
          DIR=$(find proyecto_android -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find proyecto_android -name "build.gradle" -exec dirname {} \; | head -n 1)
            cd "$DIR"
            gradle assembleDebug
          else
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaBazar-APK
          path: "**/app-debug.apk"
