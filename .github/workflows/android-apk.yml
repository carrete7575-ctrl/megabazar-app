name: Build MegaBazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: unzip -o MegaBazar_Android_proyecto_compilable.zip -d proyecto_android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: |
          DIR=$(find proyecto_android -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then
            echo "No se encontro gradlew en el zip, buscando build.gradle..."
            DIR=$(find proyecto_android -name "build.gradle" -exec dirname {} \; | head -n 1)
            cd "$DIR"
            gradle assembleDebug
          else
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaBazar-APK
          path: "**/app-debug.apk"
