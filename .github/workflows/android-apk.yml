name: Build MegaBazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: unzip -o MegaBazar_Android_proyecto_compilable.zip -d proyecto_android

      - name: Forzar icono en AndroidManifest y recursos
        run: |
          if [ -f "image_1ffc2675.jpg" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert image_1ffc2675.jpg -resize 512x512 icono_real.png
            RES_DIR=$(find proyecto_android -type d -name "res" | head -n 1)
            MANIFEST=$(find proyecto_android -name "AndroidManifest.xml" | head -n 1)
            if [ -n "$RES_DIR" ]; then
              rm -rf "$RES_DIR"/mipmap-*
              mkdir -p "$RES_DIR/mipmap-mdpi" "$RES_DIR/mipmap-hdpi" "$RES_DIR/mipmap-xhdpi" "$RES_DIR/mipmap-xxhdpi" "$RES_DIR/mipmap-xxxhdpi" "$RES_DIR/drawable"
              for dir in "$RES_DIR"/mipmap-* "$RES_DIR/drawable"; do
                cp icono_real.png "$dir/ic_launcher.png"
                cp icono_real.png "$dir/ic_launcher_round.png"
              done
            fi
            if [ -n "$MANIFEST" ]; then
              sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' "$MANIFEST"
              sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' "$MANIFEST"
              if ! grep -q "android:icon=" "$MANIFEST"; then
                sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' "$MANIFEST"
              fi
              cat "$MANIFEST"
            fi
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: |
          DIR=$(find proyecto_android -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find proyecto_android -name "build.gradle" -exec dirname {} \; | head -n 1)
            cd "$DIR"
            gradle assembleDebug
          else
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaBazar-APK
          path: "**/app-debug.apk"
